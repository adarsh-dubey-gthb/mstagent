extract_booking_task:
  description: >
    Here is the content of the newest email:
    {email_content}

    STEP 1 — READ ONLY THE FRESH MESSAGE (do this FIRST, before anything else): Emails often
    contain a forwarded or replied-to chain with OLDER messages quoted below the newest one.
    You must identify where the fresh message ends and the quoted/forwarded history begins,
    and extract NEW bookings ONLY from the fresh part — completely ignore any booking details
    that appear inside the older, quoted portion below it.

    HOW TO SPOT WHERE THE QUOTED HISTORY STARTS: look for a cluster of lines like:
        From: ...
        To: ...
        Cc: ... (sometimes absent)
        Sent: ... (or "Date: ...")
        Subject: ...
    appearing together (in any order — different email clients arrange these differently).
    Everything from that "From:/To:/Sent:/Subject:" block onward is an OLDER message being
    quoted for context — not a new request. There is often MORE than one such block, nested
    one after another (message 3, quoted inside message 2, quoted inside message 1) — the
    same rule applies to all of them: only the very TOP message, above the FIRST such block,
    is the fresh one you should extract new bookings from.

    ANOTHER STRONG SIGNAL: if you see the same booking-style content repeated with DIFFERENT,
    EARLIER dates further down the email (e.g. the fresh message asks for a cab on 4th August,
    but further down a similar-looking request mentions 3rd August, and even further down
    another mentions 2nd August) — that pattern of decreasing/older dates as you scroll down is
    a forwarded thread of separate past requests, not one email covering all those dates. Only
    the topmost (most recent) one is the actual new request.

    EXAMPLE 5 (fresh message + two layers of quoted history — extract ONLY the top one):

    Input:
    "Dear MST, We require one additional cab on 04/08/2026 at 01:00 PM under the 04hrs/40kms
    package. Kindly arrange the same and confirm. Warm Regards, Siddharth Kaithwas...
    From: "FORTUNE PARK EAST DELHI SECURITY" <...>
    To: "services" <...>
    Cc: "amit" <...>
    Sent: Sunday, August 2, 2026 6:22:07 PM
    Subject: Require one additional cab on 03/08/2026.
    Dear MST, We require one additional cab on 03/08/2026 at 10:30 AM under the 04hrs/40 km
    package. Kindly arrange the same and confirm. Warm Regards, Siddharth Kaithwas...
    From: "FORTUNE PARK EAST DELHI SECURITY" <...>
    To: "services" <...>
    Sent: Saturday, August 1, 2026 3:37:52 PM
    Subject: Re: require one additional cab on 02/08/2026
    Dear MST, This is to inform you that we require one additional cab on 02/08/2026 at sharp
    10:30 A.M as per 04Hrs/40kms Package..."

    The FIRST "From:/To:/Cc:/Sent:/Subject:" block appears right after "Siddharth Kaithwas"'s
    first signature — everything from there onward (both the 03/08/2026 AND 02/08/2026
    requests, which are themselves nested inside each other the same way) is quoted history.
    Extract ONLY the fresh 04/08/2026 request:

    [
      {
        "is_cab_booking": true, "guest_name": "", "cab_type": "", "cab_number": "",
        "mob_no": "+91-8800012197", "duty_type": "04hrs/40kms package", "bill_to": "",
        "state": "", "city": "New Delhi", "special_details": "", "booked_by": "Siddharth Kaithwas",
        "trips": [
          {"date": "04-Aug-2026", "pickup_time": "01:00 PM", "pickup_point": "FORTUNE PARK EAST DELHI, Plot D, Community Centre, Vivek Vihar, New Delhi", "drop_point": ""}
        ]
      }
    ]

    Do NOT create separate groups for the 03/08/2026 or 02/08/2026 requests — those are old,
    already-handled messages quoted for context, not new requests in this email.

    NOTE ON PAST DATES (backup safety net): the rule above should already prevent old quoted
    bookings from being extracted. But if you ever see a clearly historical booking that is
    NOT inside an identifiable quote-header block (a rare edge case), extract it anyway rather
    than guessing — a separate system automatically filters out anything dated before
    yesterday (relative to {current_date}) as a final safety net, so it's safer to include an
    ambiguous case than to silently drop something that might matter.

    STEP 2 — CANCELLATION CHECK: Check if the FRESH message (per STEP 1) is asking to CANCEL
    an existing booking — look for words like "cancel", "cancelled", "cancellation", "no
    longer required", "not required now", "please disregard", or "drop the booking". If it IS
    a cancellation:
    - Set "is_cab_booking": true (it's a legitimate, relevant email — just not a new booking).
    - .
    - write a new booking for it with all the details given but this time also write cancelled in special details and also write remove the booking from sheet manually. Instead, provide "cancellation_target": {"date"
      ("DD-MMM-YYYY"), "time" ("HH:MM AM/PM"), "pickup_point", "drop_point", "mob_no"}
      describing EXACTLY the original booking being cancelled. Here is the ONE exception to
      STEP 1's "ignore quoted history" rule: for a cancellation specifically, you MAY look
      into the quoted/forwarded section below the fresh message to find these details, since
      a cancellation reply often relies on that quoted context to specify which booking it
      means.
    - If the email doesn't give enough detail to identify which booking is being cancelled,
      still set "action": "cancel" but leave the "cancellation_target" fields you can't
      determine as empty strings rather than guessing.
    - Skip STEPS 4-6 below entirely for this group — a cancellation group never has
      "date_ranges", "legs", or "trips".
    If the fresh message is NOT a cancellation, continue to STEP 3 as normal.

    STEP 3 — SPAM CHECK: If the fresh message is a newsletter, spam, internal chatter, or not
    a real cab booking request, set "is_cab_booking" to false and leave other fields blank.
    Otherwise set it to true and continue.

    STEP 4 — READ THE EMAIL: The fresh message may be plain sentences OR a table (columns
    separated by spaces/tabs/pipes, or an HTML table). If it's a table, read each row by
    matching cells to their column header, not by position. Each row is usually one guest. If
    a row leaves a cell blank (e.g. same date as the row above), inherit that value from the
    nearest row above that has it filled in.
    STEP 5 — BUILD GROUPS: A "group" = one distinct travel pattern (one cab / one set of guests
    with identical conditions). Each group needs these flat string fields: booked_by, guest_name,
    cab_type, cab_number (blank if not given), mob_no (the GUEST's number, not the sender's),
    duty_type, bill_to, state (infer from city, leave blank if ambiguous), city, special_details.

    Each NEW BOOKING group (i.e. NOT a cancellation) needs EITHER of these two shapes for its
    travel details — pick the ONE that actually matches the email (do not use both in the same
    group):

    SHAPE 1 — "date_ranges" + "legs" — use ONLY for a genuine RECURRING DAILY pattern, where
    the exact same pickup(s)/drop(s) repeat on EVERY single day of a continuous date range
    (e.g. "pick me up every morning at 9AM and drop me back every evening at 6:30PM while I'm
    here from the 22nd to the 24th"). In this shape:
    - "date_ranges": list of {"start_date","end_date"} in "DD-MMM-YYYY" format. A single date is
      a range where start=end. "X till Y" is one range. Multiple such ranges in the email = one
      object per range, in order. Use {current_date} to resolve relative dates. Do NOT
      enumerate individual calendar dates yourself — a separate system expands ranges into days.
    - "legs": list of {"pickup_time","pickup_point","drop_point"} that apply on EVERY date above.
      If there's a morning pickup to a destination AND a separate evening pickup returning to
      the original address, that's TWO legs — morning first, evening/return leg second.

    SHAPE 2 — "trips" — use whenever the pickup/drop details are DIFFERENT for different dates,
    or the dates are NOT a continuous daily-repeating pattern. This is the correct shape for:
    - A single round trip where the outbound leg is on one date and the return leg is on a
      LATER, separate date (e.g. depart 2nd August, return 5th August — these are NOT the same
      legs repeating every day between the 2nd and 5th; the guest is not traveling on the 3rd
      or 4th at all).
    - Any set of bookings where each date has its own distinct pickup_time/pickup_point/drop_point
      that doesn't match the other dates.
    "trips" is a list of objects, each with its own "date" ("DD-MMM-YYYY"), "pickup_time",
    "pickup_point", and "drop_point" — list them in the order they appear in the email. Each
    trip object becomes exactly ONE booking row — there is no multiplying across dates here.

    RULE OF THUMB: if you are not 100% sure the SAME legs repeat on EVERY day in between two
    dates, use SHAPE 2 ("trips") instead of SHAPE 1. When in doubt, prefer "trips" — it never
    over-generates bookings, while incorrectly using "date_ranges"+"legs" can silently create
    extra bookings that were never requested.

    STEP 6 — GROUP GUESTS CORRECTLY for new bookings (apply in this order):
    a) Same pickup + drop + date + time, and only ONE cab requested → merge into one group,
       guest_name = "[first guest] +[N] more".
    b) Email explicitly asks for MORE THAN ONE cab (e.g. "need 2 cabs", "Cab 1 / Cab 2") → one
       separate group PER CAB, even if pickup/drop/date/time are otherwise identical. If seating
       per cab isn't specified, split guests evenly and note in special_details: "Guests split
       evenly across N cabs; exact seating not specified in email."
    c) If guests differ in pickup, drop, date, OR time from each other, they are NEVER merged
       under rule (a) — give each distinct combination its own group, even within the same email.

    EXAMPLE 1 (illustrates date_ranges/legs shape, guest merge, and multi-cab split together):

    Input: "Rahul, Priya & Amit — pickup 9AM Terminal 3, drop Cyber Hub, 15-Aug-2026, 1 cab" AND
    separately "6 guests, pickup 10AM Hotel Leela, drop Airport, 20-Aug-2026, need 2 cabs, seating not specified":

    [
      {
        "is_cab_booking": true, "guest_name": "Rahul +2 more", "cab_type": "Sedan",
        "date_ranges": [{"start_date": "15-Aug-2026", "end_date": "15-Aug-2026"}],
        "legs": [{"pickup_time": "09:00 AM", "pickup_point": "Terminal 3", "drop_point": "Cyber Hub, Gurugram"}],
        "special_details": "", "booked_by": "", "cab_number": "", "mob_no": "", "duty_type": "", "bill_to": "", "state": "", "city": ""
      },
      {
        "is_cab_booking": true, "guest_name": "Guest Group 1 (3 guests)", "cab_type": "Sedan",
        "date_ranges": [{"start_date": "20-Aug-2026", "end_date": "20-Aug-2026"}],
        "legs": [{"pickup_time": "10:00 AM", "pickup_point": "Hotel Leela", "drop_point": "Airport"}],
        "special_details": "Guests split evenly across 2 cabs; exact seating not specified in email.",
        "booked_by": "", "cab_number": "", "mob_no": "", "duty_type": "", "bill_to": "", "state": "", "city": ""
      },
      {
        "is_cab_booking": true, "guest_name": "Guest Group 2 (3 guests)", "cab_type": "Sedan",
        "date_ranges": [{"start_date": "20-Aug-2026", "end_date": "20-Aug-2026"}],
        "legs": [{"pickup_time": "10:00 AM", "pickup_point": "Hotel Leela", "drop_point": "Airport"}],
        "special_details": "Guests split evenly across 2 cabs; exact seating not specified in email.",
        "booked_by": "", "cab_number": "", "mob_no": "", "duty_type": "", "bill_to": "", "state": "", "city": ""
      }
    ]

    EXAMPLE 2 (illustrates the "trips" shape — round trip on two SEPARATE, non-recurring dates):

    Input: "Date-2nd August 2026, Pick Up Time 07:00 PM, First Pick Up Door No 166 B Block Sector
    52 Noida, First Drop Delhi Airport T3. Date-5th August 2026, Pick Up Time 08:15 PM, Pick Up
    Address Delhi Airport T3, Drop Door No 166 B Block Sector 52 Noida." This is ONE round trip,
    not a daily commute — use "trips", NOT "date_ranges"+"legs":

    [
      {
        "is_cab_booking": true, "guest_name": "Mr. Sivakumar S", "cab_type": "Sedan",
        "trips": [
          {"date": "02-Aug-2026", "pickup_time": "07:00 PM", "pickup_point": "Door No: 166, B Block, Sector 52, Noida", "drop_point": "Delhi Airport T3"},
          {"date": "05-Aug-2026", "pickup_time": "08:15 PM", "pickup_point": "Delhi Airport T3", "drop_point": "Door No: 166, B Block, Sector 52, Noida"}
        ],
        "special_details": "", "booked_by": "", "cab_number": "", "mob_no": "", "duty_type": "pick up and drop", "bill_to": "", "state": "", "city": ""
      }
    ]

    EXAMPLE 3 (consecutive days that LOOK similar but have a DIFFERENT return leg —
    use "trips", NOT "date_ranges"+"legs", because the legs are not identical every day):

    Input: "Date-3rd August 2026, Pick Up Time 09:00 AM, Pick Up Address Gulmohar Avenue,
    Drop at Noida GFL. Evening Pick up 06:00 PM, Drop Off Location Gulmohar Avenue.
    Date-4th August 2026, Pick Up Time 09:00 AM, Pick Up Address Gulmohar Avenue, Drop at
    Noida GFL. Afternoon Pick up 03:00 PM, Drop Off Location Delhi Airport T1." Notice Aug 3's
    evening leg returns to Gulmohar Avenue, but Aug 4's afternoon leg goes to the Airport
    instead — NOT the same legs repeating, even though both days start the same way. Do NOT
    combine these into one "date_ranges"+"legs" group (that would wrongly send Aug 4's second
    leg back to Gulmohar Avenue instead of the Airport). Use "trips" instead, one entry per
    actual pickup:
    important note - sometimes the duty_type would be "at disposal", so if you dont see specific duty_type like "pick up and drop" and you found "at disposal" then treat it as duty_type.
    [
      {
        "is_cab_booking": true, "guest_name": "Mr. Ankit Kumar", "cab_type": "Sedan",
        "trips": [
          {"date": "03-Aug-2026", "pickup_time": "09:00 AM", "pickup_point": "Gulmohar Avenue B-172, Sector 46, Noida", "drop_point": "Noida GFL"},
          {"date": "03-Aug-2026", "pickup_time": "06:00 PM", "pickup_point": "Noida GFL", "drop_point": "Gulmohar Avenue B-172, Sector 46, Noida"},
          {"date": "04-Aug-2026", "pickup_time": "09:00 AM", "pickup_point": "Gulmohar Avenue B-172, Sector 46, Noida", "drop_point": "Noida GFL"},
          {"date": "04-Aug-2026", "pickup_time": "03:00 PM", "pickup_point": "Noida GFL", "drop_point": "Delhi Airport T1"}
        ],
        "special_details": "", "booked_by": "", "cab_number": "", "mob_no": "", "duty_type": "pick up and drop", "bill_to": "", "state": "", "city": ""
      }
    ]
    important note - if there is return booking then write " there is a return booking also." in "special_details".
    EXAMPLE 4 (cancellation — relies on quoted original booking for details, produces NO
    new booking, only a cancellation_target):

    Input: "Please cancel the booking below, no longer required. Thanks. [quoted original
    message below] Date-4th August 2026, Pick Up Time 09:00 AM, Pick Up Address Gulmohar
    Avenue, Drop at Noida GFL." This is a cancellation, using the quoted message to identify
    which booking:

    [
      {
        "is_cab_booking": true, "action": "cancel",
        "cancellation_target": {
          "date": "04-Aug-2026", "time": "09:00 AM",
          "pickup_point": "Gulmohar Avenue", "drop_point": "Noida GFL", "mob_no": ""
        },
        "guest_name": "", "cab_type": "", "cab_number": "", "mob_no": "", "duty_type": "",
        "bill_to": "", "state": "", "city": "", "special_details": "", "booked_by": ""
      }
    ]

    Return ONLY a raw JSON array (no markdown, no ```json fences). Start with [ and end with ].
  expected_output: >
    A raw, valid JSON Array of group objects with "is_cab_booking" and the common guest/
    booking fields, extracted ONLY from the fresh message (ignoring quoted/forwarded history
    per STEP 1, except when needed to identify a cancellation target per STEP 2). Each group
    is EITHER a new booking — using "date_ranges"+"legs" (recurring daily pattern) OR "trips"
    (explicit per-date bookings), never both — OR a cancellation, marked with "action":
    "cancel" and a "cancellation_target" object instead (no date_ranges/legs/trips in that
    case). Free of any markdown formatting.
  agent: email_parser_agent